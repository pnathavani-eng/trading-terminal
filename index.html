  <script>
    // Live Apps Script Backend URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTHH4pS9Ge6NM1Yj8wlRCPpcnc0Q158kfEA0Tq36xnmBretYO-inFVc7-ePg7H3046/exec";
    const SECRET_TOKEN = "NSE_TRADING_SECURE_TOKEN_2026";

    const HASH_9999 = "0946b281f62b71946fe7ab1b28deae1a44e69b2d8ddb565d0a649efaa2a9831a";
    const HASH_1111 = "0ffe1abd1a08215353c233d6e009613e95eec4253832a761af28ff37ac5a150c";

    let adminPinHash = localStorage.getItem('app_admin_hash') || HASH_9999;
    let suratPinHash = localStorage.getItem('app_surat_hash') || HASH_1111;

    let userRole = null;
    let selectedExpiryType = 'CURRENT';
    let currentRawStock = 'RELIANCE';
    let isEditingClientId = null;
    let pendingDeleteTradeId = null;

    let inactivityTimer = null;

    // Toast Notification
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    // XSS Protection
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // SHA-256 Utility
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Automatic Data Migration (Ensures no old data is ever lost)
    function migrateOldData() {
      let loadedClients = JSON.parse(localStorage.getItem('app_clients_v4')) || null;
      let loadedTrades = JSON.parse(localStorage.getItem('app_trades_v4')) || null;

      if (!loadedClients) {
        loadedClients = JSON.parse(localStorage.getItem('app_clients_v3')) ||
                        JSON.parse(localStorage.getItem('app_clients_clean')) || [];
        localStorage.setItem('app_clients_v4', JSON.stringify(loadedClients));
      }

      if (!loadedTrades) {
        loadedTrades = JSON.parse(localStorage.getItem('app_trades_v3')) ||
                       JSON.parse(localStorage.getItem('app_trades_clean')) || [];
        localStorage.setItem('app_trades_v4', JSON.stringify(loadedTrades));
      }

      return { clients: loadedClients, trades: loadedTrades };
    }

    const initialStore = migrateOldData();
    let clients = initialStore.clients;
    let trades = initialStore.trades;

    function saveState() {
      localStorage.setItem('app_clients_v4', JSON.stringify(clients));
      localStorage.setItem('app_trades_v4', JSON.stringify(trades));
    }

    // Persistent Security Lockout Check
    function checkLockout() {
      const lockUntil = parseInt(localStorage.getItem('app_lock_until') || '0');
      const now = Date.now();
      if (now < lockUntil) {
        const remaining = Math.ceil((lockUntil - now) / 1000);
        document.getElementById('lockStatusMsg').innerText = `Terminal locked due to 3 failed attempts! Wait ${remaining}s.`;
        return true;
      }
      return false;
    }

    // સુધારેલું Login: Direct 9999 / 1111 Fallback સાથે
    async function verifyLogin() {
      if (checkLockout()) return;

      const pin = document.getElementById('pinInput').value.trim();
      const enteredHash = await sha256(pin);

      // એડમિન PIN ચેક (Hash અથવા ડાયરેક્ટ 9999)
      if (enteredHash === adminPinHash || pin === "9999") {
        userRole = 'admin';
        localStorage.setItem('app_admin_hash', HASH_9999);
        completeLogin();
      } 
      // સુરત બ્રાન્ચ PIN ચેક (Hash અથવા ડાયરેક્ટ 1111)
      else if (enteredHash === suratPinHash || pin === "1111") {
        userRole = 'sub_surat';
        localStorage.setItem('app_surat_hash', HASH_1111);
        completeLogin();
      } 
      else {
        let attempts = parseInt(localStorage.getItem('app_failed_attempts') || '0') + 1;
        if (attempts >= 3) {
          localStorage.setItem('app_lock_until', String(Date.now() + 30000));
          localStorage.setItem('app_failed_attempts', '0');
          showToast("3 Failed Attempts! Locked for 30s.");
          checkLockout();
        } else {
          localStorage.setItem('app_failed_attempts', String(attempts));
          showToast(`Invalid PIN! Attempts left: ${3 - attempts}`);
        }
      }
    }

    function completeLogin() {
      localStorage.setItem('app_failed_attempts', '0');
      document.getElementById('pinInput').value = '';
      document.getElementById('loginScreen').style.display = 'none';
      resetInactivityTimer();
      initApp();
      syncFromGoogleSheet(); // Auto-pull latest trades & clients from Sheet
    }

    function logout() {
      userRole = null;
      clearTimeout(inactivityTimer);
      // Blank out sensitive tables from DOM on logout
      document.getElementById('tradesBody').innerHTML = '';
      document.getElementById('billsBody').innerHTML = '';
      document.getElementById('masterPoolBody').innerHTML = '';
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        if (userRole) {
          showToast("Logged out due to 5 mins of inactivity.");
          logout();
        }
      }, 5 * 60 * 1000);
    }
    document.addEventListener('mousemove', resetInactivityTimer);
    document.addEventListener('keypress', resetInactivityTimer);
    document.addEventListener('touchstart', resetInactivityTimer);

    // Multi-Device Sync: Fetch from Sheet (doGet)
    async function syncFromGoogleSheet() {
      if (!GOOGLE_SCRIPT_URL) return;
      document.getElementById('syncStatusBadge').innerText = "🟡 Syncing...";
      try {
        const resp = await fetch(`${GOOGLE_SCRIPT_URL}?token=${SECRET_TOKEN}&branch=${userRole}`);
        const data = await resp.json();
        if (data.status === "success") {
          // Merge clients safely
          if (data.clients && data.clients.length > 0) {
            data.clients.forEach(sc => {
              const idx = clients.findIndex(c => c.id === sc.id);
              if (idx !== -1) clients[idx] = { ...clients[idx], ...sc };
              else clients.push(sc);
            });
          }
          // Merge trades safely
          if (data.trades && data.trades.length > 0) {
            data.trades.forEach(st => {
              const idx = trades.findIndex(t => t.id === st.id);
              if (idx !== -1) trades[idx] = { ...trades[idx], ...st };
              else trades.push(st);
            });
          }
          saveState();
          document.getElementById('syncStatusBadge').innerText = "🟢 Synced";
          renderAll();
        }
      } catch (e) {
        document.getElementById('syncStatusBadge').innerText = "⚪ Offline/Cached";
      }
    }

    // Multi-Device Push: Send to Sheet (doPost)
    function syncToGoogleSheet(payload) {
      if (!GOOGLE_SCRIPT_URL) return;
      payload.token = SECRET_TOKEN;
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => console.log(err));
    }

    function getCurrentWeekRange() {
      const now = new Date();
      const currentDay = now.getDay();
      const distanceToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
      const monday = new Date(now);
      monday.setDate(now.getDate() + distanceToMonday);
      monday.setHours(0, 0, 0, 0);

      const friday = new Date(monday);
      friday.setDate(monday.getDate() + 4);
      friday.setHours(23, 59, 59, 999);

      const formatDate = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
      return { start: monday, end: friday, label: `${formatDate(monday)} to ${formatDate(friday)}` };
    }

    const currentWeek = getCurrentWeekRange();

    // NSE Monthly Expiry (Calculates last Tuesday / holiday adjusted)
    function getNseExpiry(offsetMonths = 0) {
      const now = new Date();
      let targetYear = now.getFullYear();
      let targetMonth = now.getMonth() + offsetMonths;
      if (targetMonth > 11) {
        targetYear += Math.floor(targetMonth / 12);
        targetMonth = targetMonth % 12;
      }
      const lastDay = new Date(targetYear, targetMonth + 1, 0);
      let day = lastDay.getDate();
      while (new Date(targetYear, targetMonth, day).getDay() !== 2) day--;

      const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      return {
        formatted: `${day}-${monthNames[targetMonth]}-${targetYear}`,
        monthCode: `${monthNames[targetMonth]}-${targetYear}`
      };
    }

    let currentExp = getNseExpiry(0);
    let nextExp = getNseExpiry(1);

    const fnoDatabase = [
      { name: "RELIANCE", lot: 250, price: 1175.0 }, { name: "TATASTEEL", lot: 550, price: 168.2 },
      { name: "HDFCBANK", lot: 650, price: 695.5 }, { name: "INFY", lot: 400, price: 1850.0 },
      { name: "ICICIBANK", lot: 700, price: 1280.0 }, { name: "SBIN", lot: 750, price: 820.0 },
      { name: "TCS", lot: 175, price: 4120.0 }, { name: "LT", lot: 175, price: 3600.0 },
      { name: "AXISBANK", lot: 625, price: 1190.0 }, { name: "BAJFINANCE", lot: 750, price: 6900.0 },

      if (userRole === 'sub_surat') {
        document.getElementById('branchBadge').innerText = "BRANCH: SURAT (Nareshbhai)";

    function forceSwitchToDefaultTab() {
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
      if (btn) btn.classList.add('active');

    function autoGenerateClientId() {
      if (isEditingClientId) return;
      const branch = userRole === 'admin' ? document.getElementById('newClientBranch').value : 'surat';
      const prefix = branch === 'rajkot' ? 'R' : 'N';

      const numbers = [];
      clients.filter(c => c.id.startsWith(prefix)).forEach(c => {
        const num = parseInt(c.id.replace(prefix, ''));
        if (!isNaN(num)) numbers.push(num);
      });
      numbers.sort((a, b) => a - b);

      let nextNum = numbers.length > 0 ? (numbers[numbers.length - 1] + 1) : 1;
      document.getElementById('newClientId').value = `${prefix}${nextNum}`;
    }

    function toggleExpiry(type) {

      document.getElementById('expNext').classList.toggle('active', type === 'NEXT');
      updateContractDisplay();
    }

      return selectedExpiryType === 'CURRENT' ? currentExp.monthCode : nextExp.monthCode;

      return `${currentRawStock} ${getActiveMonthCode()} FUT`;
    }

      document.getElementById('stockSearch').value = contract;
      document.getElementById('priceLabel').innerText = `Price (${contract})`;

      const stock = stockMap.get(currentRawStock);
      if (stock) {
        document.getElementById('priceInput').value = selectedExpiryType === 'CURRENT' ? stock.price : (stock.price * 1.008).toFixed(2);

    let filterTimeout = null;
    function debounceFilterStocks() {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(filterStocks, 150);

    function filterStocks() {
      const input = document.getElementById('stockSearch').value.toUpperCase().replace(/ (JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)(-[0-9]{4})? FUT/g, '').trim();
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = "";
      if (!input) { resultsDiv.style.display = "none"; return; }

      const activeCode = getActiveMonthCode();
      const matched = fnoDatabase.filter(s => s.name.includes(input)).slice(0, 20);
      if (matched.length > 0) {
        resultsDiv.innerHTML = matched.map(s => `
          <div class="search-item" onclick="selectStock('${s.name}', ${s.lot})">
            <span><b>${escapeHtml(s.name)} ${activeCode} FUT</b></span>
            <small style="color:var(--muted)">Lot: ${s.lot}</small>

        `).join('');
        resultsDiv.style.display = "block";
      } else {
        resultsDiv.style.display = "none";

    }

    function selectStock(name, lot) {
      currentRawStock = name;
      updateContractDisplay();
      document.getElementById('qtyInput').value = lot;
      document.getElementById('searchResults').style.display = "none";
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-container')) {
        document.getElementById('searchResults').style.display = "none";
      }

    // FIFO P&L Engine (Realized P&L vs Open Lots)
    function computeClientFIFO(clientId) {
      const clientTrades = trades.filter(t => t.clientId === clientId && t.status !== 'CANCELLED');
      const contractQueues = {};
      let realizedPnL = 0;
      let openLots = 0;

      clientTrades.forEach(t => {
        if (!contractQueues[t.contract]) contractQueues[t.contract] = [];
        contractQueues[t.contract].push({ ...t, remainingQty: t.qty });
      });

      for (let contract in contractQueues) {
        const queue = contractQueues[contract];
        const buys = queue.filter(x => x.action === 'BUY');
        const sells = queue.filter(x => x.action === 'SELL');

        let bIdx = 0, sIdx = 0;
        while (bIdx < buys.length && sIdx < sells.length) {
          const b = buys[bIdx];
          const s = sells[sIdx];
          const matchQty = Math.min(b.remainingQty, s.remainingQty);

          realizedPnL += (s.netRate - b.netRate) * matchQty;

          b.remainingQty -= matchQty;
          s.remainingQty -= matchQty;

          if (b.remainingQty === 0) bIdx++;
          if (s.remainingQty === 0) sIdx++;
        }

        buys.slice(bIdx).forEach(b => openLots += b.remainingQty);
        sells.slice(sIdx).forEach(s => openLots += s.remainingQty);
      }

      return { realizedPnL, openLots };
    }

    function renderAll() {
      renderClientsDropdown();
      renderTrades();
      if (userRole === 'admin') renderMasterPool();
      renderBills();
      renderClientsList();
    }

    function renderClientsDropdown() {
      const select = document.getElementById('clientSelect');
      const visible = getVisibleClients();
      select.innerHTML = visible.map(c => 
        `<option value="${escapeHtml(c.id)}">${escapeHtml(c.id)} - ${escapeHtml(c.name)} (${escapeHtml(c.branch.toUpperCase())})</option>`
      ).join('');
    }

    function renderTrades() {
      const tbody = document.getElementById('tradesBody');
      const visibleTrades = getVisibleTrades();

      if (visibleTrades.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:14px;">No active trades placed.</td></tr>`;
        return;
      }

      tbody.innerHTML = visibleTrades.map(t => {
        let actionBtn = userRole === 'admin'
          ? `<button class="btn-cancel" onclick="openDeleteModal('${escapeHtml(t.id)}')">Delete</button>`
          : (t.cancellationRequested === 'REQUESTED' || t.cancelReq
              ? `<span style="color:#f59e0b; font-size:11px;">Cancel Pending</span>`
              : `<button class="btn-req" onclick="requestCancel('${escapeHtml(t.id)}')">Request Cancel</button>`);

        return `<tr>
          <td><b>${escapeHtml(t.clientId)}</b> - ${escapeHtml(t.clientName)}</td>
          <td><b>${escapeHtml(t.contract)}</b><span class="timestamp-text">⏱️ ${escapeHtml(t.timestamp)}</span></td>
          <td class="${t.action==='BUY'?'green':'red'}">${escapeHtml(t.action)}</td>
          <td>${t.qty}</td>
          <td><b>₹${Number(t.netRate).toFixed(2)}</b></td>
          <td>${actionBtn}</td>
        </tr>`;
      }).join('');
    }

    function renderMasterPool() {
      const tbody = document.getElementById('masterPoolBody');
      const activeTrades = getVisibleTrades();

      if (activeTrades.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:14px;">Master Pool is empty.</td></tr>`;
        return;
      }

      const poolMap = {};
      activeTrades.forEach(t => {
        if (!poolMap[t.contract]) poolMap[t.contract] = { buy: 0, sell: 0 };
        if (t.action === 'BUY') poolMap[t.contract].buy += t.qty;
        else poolMap[t.contract].sell += t.qty;
      });

      const rows = [];
      for (let contract in poolMap) {
        const item = poolMap[contract];
        const net = item.buy - item.sell;
        let netHtml = net > 0 ? `<span class="green">+${net} (LONG)</span>` : (net < 0 ? `<span class="red">${net} (SHORT)</span>` : `<span style="color:var(--muted)">0 (SQUARED)</span>`);
        rows.push(`<tr><td><b>${escapeHtml(contract)}</b></td><td>${item.buy}</td><td>${item.sell}</td><td>${netHtml}</td></tr>`);
      }
      tbody.innerHTML = rows.join('');
    }

    function renderBills() {
      const tbody = document.getElementById('billsBody');
      const visibleClients = getVisibleClients();

      if (visibleClients.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:14px;">No clients available.</td></tr>`;
        return;
      }

      tbody.innerHTML = visibleClients.map(c => {
        const fifo = computeClientFIFO(c.id);
        const pnlDisplay = fifo.realizedPnL >= 0 ? `+₹${fifo.realizedPnL.toFixed(2)}` : `-₹${Math.abs(fifo.realizedPnL).toFixed(2)}`;
        const pnlClass = fifo.realizedPnL >= 0 ? 'green' : 'red';
        const openNotice = fifo.openLots > 0 ? `<span style="color:#f59e0b;">${fifo.openLots} Open</span>` : `<span style="color:var(--muted);">Nil</span>`;

        return `<tr>
          <td><b>${escapeHtml(c.id)}</b> - ${escapeHtml(c.name)}</td>
          <td class="${pnlClass}"><b>${pnlDisplay}</b></td>
          <td>${openNotice}</td>
          <td>
            <button class="btn-share" onclick="shareClientFile('${escapeHtml(c.id)}')">📎 Bill</button>
            <button class="btn-wa" onclick="sendWhatsAppSummary('${escapeHtml(c.id)}')">💬 WA</button>
          </td>
        </tr>`;
      }).join('');
    }

    function renderClientsList() {
      const tbody = document.getElementById('clientsListBody');
      const visibleClients = getVisibleClients();

      if (visibleClients.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:14px;">No active clients.</td></tr>`;
        return;
      }

      tbody.innerHTML = visibleClients.map(c => `
        <tr>
          <td><b>${escapeHtml(c.id)}</b></td>
          <td>${escapeHtml(c.name)}</td>
          <td>${c.rate}%</td>
          <td>
            <button class="btn-edit" onclick="startEditClient('${escapeHtml(c.id)}')">Edit</button>
            <button class="btn-cancel" onclick="softRemoveClient('${escapeHtml(c.id)}')">Exit</button>
          </td>
        </tr>
      `).join('');

    // WhatsApp Statement Direct Link
    function sendWhatsAppSummary(clientId) {
      const client = clients.find(c => c.id === clientId);
      if (!client || !client.mobile) return showToast("Mobile number missing!");
      const fifo = computeClientFIFO(clientId);

      const msg = `*NSE F&O Statement: ${client.name} (${client.id})*\nCycle: ${currentWeek.label}\n\n*Realized P&L:* ₹${fifo.realizedPnL.toFixed(2)}\n*Open Lots:* ${fifo.openLots}\nStatus: ${fifo.realizedPnL >= 0 ? 'Net Receivable (Credit)' : 'Net Payable (Debit)'}`;
      const url = `https://wa.me/91${client.mobile}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    // CSV File Generation with Formula Injection Sanitization
    function shareClientFile(clientId) {
      const client = clients.find(c => c.id === clientId);
      if (!client) return;

      const clientTrades = trades.filter(t => t.clientId === clientId && t.status !== 'CANCELLED');
      const fifo = computeClientFIFO(clientId);

      const safeName = (client.name.startsWith('=') || client.name.startsWith('+') || client.name.startsWith('-') || client.name.startsWith('@')) ? `'${client.name}` : client.name;

      let csv = "\uFEFFNSE F&O WEEKLY SETTLEMENT STATEMENT\r\n";
      csv += `Client Name: ${safeName} (${client.id})\r\n`;
      csv += `Settlement Cycle: ${currentWeek.label}\r\n`;
      csv += "--------------------------------------------------------\r\n";
      csv += "Timestamp,Trade ID,Contract,Side,Qty,Execution Rate,Gross Amount\r\n";

      clientTrades.forEach(t => {
        const amt = (t.qty * t.netRate).toFixed(2);
        csv += `"${t.timestamp}","${t.id}","${t.contract}","${t.action}",${t.qty},${Number(t.netRate).toFixed(2)},${amt}\r\n`;
      });

      csv += "--------------------------------------------------------\r\n";
      csv += `Total Matched Realized P&L: ₹${fifo.realizedPnL.toFixed(2)}\r\n`;
      csv += `Open Unmatched Positions: ${fifo.openLots} Lots\r\n`;
      csv += fifo.realizedPnL >= 0 ? `Net Status: Receivable by Client (CREDIT)\r\n` : `Net Status: Payable to Broker (DEBIT)\r\n`;

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const filename = `Statement_${client.id}_${client.name}.csv`;
      const file = new File([blob], filename, { type: 'text/csv' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: `Statement - ${client.name}`, text: `NSE F&O Statement (${currentWeek.label})` }).catch(() => {});
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }
    }

    // Place Order Execution
    function handleOrderPlacement(action) {
      const btnBuy = document.getElementById('btnBuy');
      const btnSell = document.getElementById('btnSell');
      btnBuy.disabled = true;
      btnSell.disabled = true;
      setTimeout(() => { btnBuy.disabled = false; btnSell.disabled = false; }, 1000);

      const selectedId = document.getElementById('clientSelect').value;
      const clientObj = clients.find(c => c.id === selectedId);
      if (!clientObj) return showToast("Select client first!");

      const contract = buildContractString();
      const qty = parseInt(document.getElementById('qtyInput').value) || 0;
      const basePrice = parseFloat(document.getElementById('priceInput').value) || 0;

      if (qty <= 0) return showToast("Quantity must be greater than 0!");
      if (basePrice <= 0) return showToast("Enter a valid price!");

      const now = new Date();
      const formattedTimestamp = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${now.toLocaleTimeString('en-IN', { hour12: false })}`;

      const brokerageRate = typeof clientObj.rate === 'number' ? clientObj.rate : 0.01;
      const brokerageFactor = (basePrice * (brokerageRate / 100));
      const netRate = action === 'BUY' ? (basePrice + brokerageFactor) : (basePrice - brokerageFactor);

      const tradeObj = {
        id: "TR_" + crypto.randomUUID().slice(0, 8),
        clientId: clientObj.id,
        clientName: clientObj.name,
        branch: clientObj.branch,
        contract: contract,
        action: action,
        qty: qty,
        basePrice: basePrice,
        netRate: netRate,
        timestamp: formattedTimestamp,
        isoDate: now.toISOString(),
        expiry: selectedExpiryType === 'CURRENT' ? currentExp.formatted : nextExp.formatted,
        status: "OPEN"
      };

      trades.push(tradeObj);
      saveState();

      syncToGoogleSheet({
        action: "add_trade",
        id: tradeObj.id,
        timestamp: tradeObj.timestamp,
        branch: tradeObj.branch,
        clientId: tradeObj.clientId,
        clientName: tradeObj.clientName,
        contract: tradeObj.contract,
        actionSide: tradeObj.action,
        qty: tradeObj.qty,
        basePrice: tradeObj.basePrice,
        netRate: Number(netRate).toFixed(2),
        expiry: tradeObj.expiry
      });

      showToast(`Order Placed: ${tradeObj.contract} @ ₹${netRate.toFixed(2)}`);
      renderAll();
    }

    function openDeleteModal(tradeId) {
      pendingDeleteTradeId = tradeId;
      document.getElementById('modalPinInput').value = '';
      document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
      pendingDeleteTradeId = null;
      document.getElementById('deleteModal').style.display = 'none';
    }

    async function confirmAdminDelete() {
      const pin = document.getElementById('modalPinInput').value.trim();
      const pinHash = await sha256(pin);

      if (pinHash === adminPinHash || pin === "9999") {
        const t = trades.find(x => x.id === pendingDeleteTradeId);
        if (t) {
          t.status = "CANCELLED";
          saveState();

          syncToGoogleSheet({
            action: "cancel_trade",
            id: t.id,
            status: "CANCELLED",
            reason: "Admin Delete by HO"
          });

          showToast("Trade Cancelled and Logged.");
          renderAll();
        }
        closeDeleteModal();
      } else {
        showToast("Incorrect Master PIN!");
      }
    }

    function requestCancel(tradeId) {
      const t = trades.find(x => x.id === tradeId);
      if (t) {
        t.cancelReq = true;
        saveState();

        syncToGoogleSheet({
          action: "cancel_trade",
          id: t.id,
          status: "PENDING_CANCEL",
          reason: "Cancellation Request by Surat Operator"
        });

        showToast("Cancellation request submitted.");
        renderTrades();
      }
    }

    function saveClient() {
      const id = document.getElementById('newClientId').value.trim();
      const name = document.getElementById('newClientName').value.trim();
      const mobile = document.getElementById('newClientMobile').value.trim();
      const rawRate = parseFloat(document.getElementById('newClientRate').value);
      const rate = isNaN(rawRate) ? 0.01 : Math.max(0, Math.min(1, rawRate));
      const branch = userRole === 'admin' ? document.getElementById('newClientBranch').value : 'surat';

      if (!name) return showToast("Enter client name!");
      if (!/^\d{10}$/.test(mobile)) return showToast("Enter a valid 10-digit mobile number!");

      if (isEditingClientId) {
        const idx = clients.findIndex(c => c.id === isEditingClientId);
        if (idx !== -1) {
          clients[idx].name = name;
          clients[idx].mobile = mobile;
          clients[idx].rate = rate;
          clients[idx].branch = branch;
        }
        showToast(`Client ${id} updated.`);
        cancelEdit();
      } else {
        clients.push({ id, name, branch, mobile: mobile, rate: rate, active: true });
        showToast(`Client ${name} registered under ${id}.`);

        syncToGoogleSheet({
          action: "add_client",
          id: id,
          name: name,
          mobile: mobile,
          rate: rate,
          branch: branch
        });

        document.getElementById('newClientName').value = '';
        document.getElementById('newClientMobile').value = '';
        autoGenerateClientId();
      }

      saveState();
      renderAll();
      switchTab('terminalTab');
    }

    function startEditClient(id) {
      const client = clients.find(c => c.id === id);
      if (!client) return;
      isEditingClientId = id;

      document.getElementById('newClientId').value = client.id;
      document.getElementById('newClientName').value = client.name;
      document.getElementById('newClientMobile').value = client.mobile || client.phone || '';
      document.getElementById('newClientRate').value = client.rate;
      if (userRole === 'admin') document.getElementById('newClientBranch').value = client.branch;

      document.getElementById('saveClientBtn').innerText = "Update Client";
      document.getElementById('cancelEditBtn').style.display = "inline-block";
      switchTab('manageTab');
    }

    function cancelEdit() {
      isEditingClientId = null;
      document.getElementById('newClientName').value = '';
      document.getElementById('newClientMobile').value = '';
      document.getElementById('saveClientBtn').innerText = "Save Client";
      document.getElementById('cancelEditBtn').style.display = "none";
      autoGenerateClientId();
    }

    function softRemoveClient(id) {
      if (confirm(`Remove client ${id}? Trade history will remain intact for audit.`)) {
        const client = clients.find(c => c.id === id);
        if (client) {
          client.active = false;
          saveState();
          renderAll();
          autoGenerateClientId();
          showToast(`Client ${id} removed.`);
        }
      }
    }

    async function saveNewPins() {
      const newAdm = document.getElementById('newAdminPin').value.trim();
      const newSrt = document.getElementById('newSuratPin').value.trim();

      if (userRole === 'admin' && newAdm) {
        adminPinHash = await sha256(newAdm);
        localStorage.setItem('app_admin_hash', adminPinHash);
      }
      if (newSrt) {
        suratPinHash = await sha256(newSrt);
        localStorage.setItem('app_surat_hash', suratPinHash);
      }
      document.getElementById('newAdminPin').value = '';
      document.getElementById('newSuratPin').value = '';
      showToast("Security PINs updated.");
    }
  </script>
